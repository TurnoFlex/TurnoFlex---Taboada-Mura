infra/db-schema-and-seed
version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: turnoflex_db
    restart: always
    environment:
      POSTGRES_DB: turnoflex
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./infra/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

volumes:
  postgres_data:
=======
services: 

  postgres-db:
    image: postgres:15-alpine
    container_name: turnoflex_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-turnoflex_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - turnoflex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-turnoflex_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  turnoflex_pgdata:
    name: turnoflex_postgres_volume
main
